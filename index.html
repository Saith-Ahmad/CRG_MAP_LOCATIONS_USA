<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRG Map Prototype</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
  <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.Default.css">
  <!-- Our stylesheet loads last so it can override the library defaults. -->
  <link rel="stylesheet" href="style.css">
</head>
<body style="height: 1500px">
  <div class="crg-map-wrap">
    <button type="button" id="crg-map-reset" class="crg-map-reset" aria-label="Reset map to national view">Reset map</button>
    <button type="button" id="crg-map-fullscreen" class="crg-map-fullscreen" aria-label="View map full screen" aria-pressed="false">
      <svg class="crg-fs-icon crg-fs-grow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5"/>
      </svg>
      <svg class="crg-fs-icon crg-fs-shrink" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M8 3v5H3M21 8h-5V3M16 21v-5h5M3 16h5v5"/>
      </svg>
    </button>
    <div id="crg-map" class="crg-map" role="region" aria-label="Map of CRG operating locations"></div>
  </div>

  <!-- Location directory: the prototype script fills this section; in WordPress
       PHP prints the same details/summary/ul/button markup into it. -->
  <section id="crg-dir" class="crg-dir" aria-label="Location directory"></section>

  <!-- Order matters: Leaflet first, then the add-on that depends on it, then our code. -->
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/markercluster/leaflet.markercluster.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="map.js"></script>
  <script src="render-directory.js"></script>
  <script src="crg-directory.js"></script>
  <script src="main.js"></script>
</body>
</html>
